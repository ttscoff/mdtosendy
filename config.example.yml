# Email Generator Configuration
# Copy this file to config.yml and fill in your values

# Sendy API Configuration
sendy:
  api_url: "https://your-domain.com/api/campaigns/create.php"
  api_key: "your-api-key-here"
  brand_id: "1"
  list_ids: "your-list-id-here"
  # Optional: URL to open in browser after creating a campaign (ignored for --preview)
  # followup_url: 'https://example.com/campaigns'

# Email Settings
email:
  from_name: "Your Name"
  from_email: "your-email@example.com"
  reply_to: "your-email@example.com"

# SMTP Settings (required for --test-send)
# Optional: If not configured, defaults to localhost:25
smtp:
  host: "smtp.gmail.com"
  port: 587
  domain: "gmail.com"
  # Required for Gmail: Use your full email address
  user: "me@example.com"
  # Required for Gmail: Use an App Password (not your regular password)
  # Generate at: https://myaccount.google.com/apppasswords
  password: "your-app-password-here"
  # Authentication method for Gmail
  auth: "plain"
  # Enable STARTTLS for Gmail (required for port 587)
  starttls: true
  # Alternative Gmail configuration using SSL (port 465):
  # host: "smtp.gmail.com"
  # port: 465
  # ssl: true
  # starttls: false

# Campaign Settings
campaign:
  track_opens: "1"
  track_clicks: "1"
  default_timezone: "America/Chicago"

# Template Settings
template:
  header_image_url: "https://your-domain.com/img/email/header.jpg"
  header_image_alt: "Email Header"
  header_image_width: 600
  header_image_height: 185
  signature_image_url: "https://your-domain.com/img/signature.png"
  signature_image_alt: "Signature"
  signature_image_width: 98
  signature_image_height: 98
  signature_text: "-Your Name"
  # Optional: Default greeting inserted after header image, before first paragraph
  # Can be overridden in YAML frontmatter with 'greeting: xxx' or 'salutation: xxx' or using {% greeting %} or {% salutation %} tag in markdown
  # greeting: 'Hey [Name,fallback=there],'
  # salutation: 'Hey [Name,fallback=there],'  # alias for greeting (takes precedence if both are defined)
  # Optional: Primary footer appears after signature, before unsubscribe section
  # Can contain Markdown or HTML (e.g., product links, promotional content)
  # primary_footer: |
  #   [![](/mas.jpg)](example.com "Purchase on the Mac App Store") | [![](/paddle.jpg)](example.com "Purchase directly")
  # Footer text - can contain Markdown and will preserve <webversion> and <unsubscribe> tags
  # Sendy will replace these tags when sending the email
  # footer_text: |
  #   Copyright © 2025 Your Name<br>
  #   123 Main St<br>
  #   City, State ZIP
  #
  #   <webversion>View on the web</webversion> | <unsubscribe>Unsubscribe</unsubscribe>

# File Paths
paths:
  template_file: "email-template.html"
  styles_file: "styles.css"

# Markdown Processor
markdown:
  processor: "apex" # or 'pandoc', 'kramdown', etc.

# CDN Image Upload Settings (optional)
# Automatically upload local images to CDN and replace URLs in output HTML
# cdn:
#   # Base URL for CDN (required if cdn is enabled)
#   url: "https://cdn.markedapp.com"
#   # Upload type: s3, scp, or sftp
#   type: "s3"
#   # For S3: username = access key, password = secret key, path = bucket name
#   # For SCP/SFTP: username = SSH username, password = SSH password, path = remote directory
#   username: "your-access-key-id"
#   password: "your-secret-access-key"
#   path: "your-bucket-name"
#   # Optional: hostname (required for SCP/SFTP, not used for S3)
#   # hostname: "example.com"
#   # Optional: port (defaults to 22 for SCP/SFTP, not used for S3)
#   # port: 22
#   # Optional: subdirectory within bucket/path to store images
#   # subdirectory: "images"
#   # Optional: AWS region for S3 (defaults to us-east-1)
#   # region: "us-west-2"
#   # Optional: S3 ACL (e.g., "public-read"). Leave unset if bucket has ACLs disabled.
#   # If ACLs are disabled, ensure your bucket has a policy allowing public read access.
#   # Example bucket policy:
#   # {
#   #   "Version": "2012-10-17",
#   #   "Statement": [
#   #     {
#   #       "Sid": "PublicReadGetObject",
#   #       "Effect": "Allow",
#   #       "Principal": "*",
#   #       "Action": "s3:GetObject",
#   #       "Resource": "arn:aws:s3:::your-bucket-name/*"
#   #     }
#   #   ]
#   # }
#   # acl: "public-read"

